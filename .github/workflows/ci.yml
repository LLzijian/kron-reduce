          tests/test_nonlinear_history.py tests/test_trajectory_stability.py
          tests/test_machine_local_nonlinear_history_workflow.py
          src/kron_reduce/models/state_port.py src/kron_reduce/evaluation/state_port_correctness.py
          src/kron_reduce/workflows/state_port_synthetic.py
          tests/test_state_port.py tests/test_state_port_workflow.py
          src/kron_reduce/evaluation/state_port_training.py src/kron_reduce/evaluation/state_port_train_audit.py
          src/kron_reduce/evaluation/state_port_train_scores.py src/kron_reduce/workflows/kiki_state_port_train.py
          tests/test_state_port_training.py tests/test_state_port_train_audit.py
          tests/test_state_port_train_scores.py tests/test_state_port_train_workflow.py
          scripts/audit_state_port_train_saved.py tests/test_state_port_train_saved_audit.py
          tests/test_state_port_train_saved_guard.py
          scripts/audit_state_port_saved.py tests/test_state_port_saved_audit.py
          src/kron_reduce/data/audit_access_ledger.py src/kron_reduce/data/durable_audit_ledger.py
          src/kron_reduce/data/limited_hdf_audit.py src/kron_reduce/evaluation/record20_input.py
          src/kron_reduce/evaluation/record20_coordinates.py src/kron_reduce/evaluation/record20_metadata.py
          src/kron_reduce/workflows/kiki_record20_input_audit.py
          src/kron_reduce/evaluation/audit_budget.py src/kron_reduce/evaluation/train_mechanism_audit.py
          src/kron_reduce/workflows/kiki_train_mechanism.py
          src/kron_reduce/evaluation/train_refinement_audit.py
          src/kron_reduce/workflows/kiki_train_refinement.py
          src/kron_reduce/data/limited_npz_audit.py src/kron_reduce/evaluation/integral_initializer.py
          src/kron_reduce/evaluation/history_metrics.py src/kron_reduce/evaluation/history_mechanism.py
          src/kron_reduce/evaluation/scoped_audit_journal.py src/kron_reduce/evaluation/history_cache_preflight.py
          src/kron_reduce/workflows/kiki_integral_history_audit.py
