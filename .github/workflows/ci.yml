name: Research engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU research runtime
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' -c requirements/constraints-py312.txt
      - name: Audit contracts and registered metadata
        run: python -m project_harness audit
      - name: Lint the harness and audited workflows
        run: >-
          python -m ruff check project_harness scripts/register_kiki_dataset.py
          src/kron_reduce/data/task3_full.py src/kron_reduce/evaluation/kiki_machine_local_full.py
          src/kron_reduce/evaluation/machine_local_equation.py src/kron_reduce/evaluation/machine_local_equation_cases.py
          src/kron_reduce/evaluation/machine_local_equation_fit.py src/kron_reduce/models/machine_local_equation.py
          src/kron_reduce/workflows/machine_local_equation.py tests/test_machine_local_equation.py
          src/kron_reduce/workflows/machine_local_memory.py src/kron_reduce/evaluation/machine_local_memory_diagnosis.py
          src/kron_reduce/evaluation/machine_local_memory_calibration.py src/kron_reduce/evaluation/machine_local_memory_fit.py
          tests/test_machine_local_memory_diagnosis.py tests/test_machine_local_memory_fit.py
          src/kron_reduce/evaluation/kiki_machine_local_memory.py src/kron_reduce/workflows/kiki_machine_local_memory.py
          src/kron_reduce/models/machine_local_topology.py src/kron_reduce/workflows/machine_local_topology.py
          src/kron_reduce/evaluation/machine_local_topology.py src/kron_reduce/evaluation/machine_local_topology_truth.py
          tests/test_machine_local_topology.py
          src/kron_reduce/evaluation/kiki_machine_local_r20_r21.py src/kron_reduce/workflows/kiki_machine_local_r20_r21.py
          scripts/audit_kiki_machine_local_r20_r21_saved.py
          tests/test_machine_local_trainable_stiffness.py tests/test_kiki_machine_local_r20_r21.py
          src/kron_reduce/workflows/kiki_machine_local_full.py scripts/audit_kiki_machine_local_full_saved.py
          src/kron_reduce/evaluation/machine_local_hidden_oracle.py
          src/kron_reduce/workflows/machine_local_hidden_oracle.py
          src/kron_reduce/models/machine_local_forecast.py src/kron_reduce/evaluation/machine_local_stiffness_calibration.py
          src/kron_reduce/workflows/machine_local_stiffness_calibration.py
          tests/test_machine_local_forecast.py tests/test_machine_local_stiffness_calibration.py
          tests/test_task3_full.py tests/test_kiki_machine_local_full.py tests/test_kiki_machine_local_full_saved.py
          tests/test_machine_local_hidden_oracle.py tests/test_policy_consumed_audit.py
          scripts/audit_machine_local_hidden_oracle_saved.py tests/test_machine_local_hidden_oracle_saved_audit.py
          src/kron_reduce/models/conditional_encoder.py
          src/kron_reduce/evaluation/machine_local_initializer_diagnosis.py
          src/kron_reduce/workflows/machine_local_initializer_diagnosis.py
          tests/test_conditional_encoder.py tests/test_initializer_diagnosis_workflow.py
          src/kron_reduce/models/machine_local.py src/kron_reduce/evaluation/machine_local_synthetic.py
          src/kron_reduce/workflows/machine_local_synthetic.py
          tests/test_machine_local.py tests/test_machine_local_workflow.py
          src/kron_reduce/models/discrete_history_initializer.py
          src/kron_reduce/evaluation/machine_local_observer.py
          src/kron_reduce/workflows/machine_local_observer.py
          tests/test_discrete_history_initializer.py tests/test_observer_workflow.py
          src/kron_reduce/models/joint_history_initializer.py
          src/kron_reduce/evaluation/machine_local_joint_observer.py
          src/kron_reduce/workflows/machine_local_joint_observer.py
          tests/test_joint_history_initializer.py tests/test_joint_observer_workflow.py
          src/kron_reduce/evaluation/gaussian_state_posterior.py
          src/kron_reduce/evaluation/machine_local_gaussian_oracle.py
          src/kron_reduce/workflows/machine_local_gaussian_oracle.py
          tests/test_gaussian_state_posterior.py tests/test_gaussian_oracle_risks.py
          tests/test_gaussian_oracle_workflow.py
          src/kron_reduce/models/differentiable_history.py
          src/kron_reduce/models/nonlinear_history.py
          src/kron_reduce/evaluation/trajectory_stability.py
          src/kron_reduce/evaluation/machine_local_nonlinear_history.py
          src/kron_reduce/workflows/machine_local_nonlinear_history.py
          src/kron_reduce/evaluation/machine_local_clean_learning.py
          src/kron_reduce/workflows/machine_local_clean_learning.py
