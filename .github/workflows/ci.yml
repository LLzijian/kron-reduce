name: Research engineering checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU research runtime
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' -c requirements/constraints-py312.txt
      - name: Audit contracts and registered metadata
        run: python -m project_harness audit
      - name: Check engineering changes
        run: python -m ruff check project_harness/policy.py project_harness/git_state.py project_harness/runner.py scripts/register_kiki_dataset.py tests/test_research_policy.py tests/test_runner_safety.py tests/test_development_file_bindings.py
      - name: Run policy, causality and synthetic checks
        run: >-
          python -m pytest -q
          tests/test_research_policy.py tests/test_runner_safety.py tests/test_data_registry.py
          tests/test_development_file_bindings.py
          tests/test_kiki_history.py tests/test_kiki_scoring.py
          tests/test_kiki_stability_comparison.py tests/test_nonlinear_latent.py
          tests/test_causal_latent.py tests/test_stability_region.py
          tests/test_kiki_short_history_reader.py tests/test_kiki_short_history.py
          tests/test_recorded_error_audit.py
          tests/test_paired_training.py tests/test_paired_workflow.py
          tests/test_joint_refinement.py tests/test_joint_refinement_workflow.py
          tests/test_tilted_optimizer_resume.py tests/test_tilted_training_workflow.py
          tests/test_nested_memory.py tests/test_memory_order_workflow.py
          tests/test_audit_budget.py tests/test_train_mechanism_audit.py tests/test_train_mechanism_workflow.py
          tests/test_train_refinement_budget.py tests/test_train_refinement_audit.py tests/test_train_refinement_workflow.py
          tests/test_audit_access_ledger.py tests/test_durable_audit_ledger.py
          tests/test_limited_hdf_audit.py tests/test_record20_input.py
          tests/test_record20_coordinates.py tests/test_record20_metadata.py
          tests/test_bounded_input_cli_guard.py tests/test_record20_workflow.py
      - name: Check bounded input audit code
        run: >-
          python -m ruff check
          src/kron_reduce/data/audit_access_ledger.py src/kron_reduce/data/durable_audit_ledger.py
          src/kron_reduce/data/limited_hdf_audit.py src/kron_reduce/evaluation/record20_input.py
          src/kron_reduce/evaluation/record20_coordinates.py src/kron_reduce/evaluation/record20_metadata.py
          src/kron_reduce/workflows/kiki_record20_input_audit.py
          tests/test_audit_access_ledger.py tests/test_durable_audit_ledger.py
          tests/test_limited_hdf_audit.py tests/test_record20_input.py tests/test_record20_coordinates.py
          tests/test_record20_metadata.py tests/test_bounded_input_cli_guard.py tests/test_record20_workflow.py
      - name: Check fixed-model audit code
        run: python -m ruff check src/kron_reduce/evaluation/audit_budget.py src/kron_reduce/evaluation/train_mechanism_audit.py src/kron_reduce/workflows/kiki_train_mechanism.py tests/test_audit_budget.py tests/test_train_mechanism_audit.py tests/test_train_mechanism_workflow.py
      - name: Check all-train refinement code
        run: python -m ruff check src/kron_reduce/evaluation/train_refinement_audit.py src/kron_reduce/workflows/kiki_train_refinement.py tests/test_train_refinement_budget.py tests/test_train_refinement_audit.py tests/test_train_refinement_workflow.py
      - name: Check integral history code
        run: >-
          python -m ruff check
          src/kron_reduce/data/limited_npz_audit.py
          src/kron_reduce/evaluation/integral_initializer.py
          src/kron_reduce/evaluation/history_metrics.py
          src/kron_reduce/evaluation/history_mechanism.py
          src/kron_reduce/evaluation/scoped_audit_journal.py
          src/kron_reduce/evaluation/history_cache_preflight.py
          src/kron_reduce/workflows/kiki_integral_history_audit.py
          tests/test_limited_npz_audit.py tests/test_integral_initializer.py
          tests/test_history_cache_preflight.py
          tests/test_history_metrics.py tests/test_history_mechanism.py
          tests/test_scoped_audit_journal.py tests/test_integral_history_workflow.py
          tests/test_integral_history_artifact_contract.py
      - name: Run A14 integral history synthetic checks
        run: >-
          python -m pytest -q
          tests/test_limited_npz_audit.py tests/test_integral_initializer.py
          tests/test_history_cache_preflight.py
          tests/test_history_metrics.py tests/test_history_mechanism.py
          tests/test_scoped_audit_journal.py tests/test_integral_history_workflow.py
          tests/test_integral_history_artifact_contract.py
      - name: Check A16 finite power diagnostic
        run: >-
          python -m ruff check
          src/kron_reduce/data/pm_impulse_reader.py
          src/kron_reduce/evaluation/pm_impulse_audit.py
          src/kron_reduce/workflows/kiki_pm_impulse_audit.py
          tests/test_pm_impulse_reader.py tests/test_pm_impulse_audit.py
          tests/test_pm_impulse_workflow.py
      - name: Run A16 synthetic and finite-read checks
        run: >-
          python -m pytest -q
          tests/test_pm_impulse_reader.py tests/test_pm_impulse_audit.py
          tests/test_pm_impulse_workflow.py
      - name: Record actual environment
        if: always()
        run: python -m pip freeze > ci-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-environment
          path: ci-environment.txt
