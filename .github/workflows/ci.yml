          src/kron_reduce/workflows/kiki_pm_impulse_audit.py src/kron_reduce/workflows/kiki_task3_frozen_eval.py
          src/kron_reduce/evaluation/constant_c_observability.py src/kron_reduce/workflows/constant_c_synthetic.py
          src/kron_reduce/evaluation/energy_constrained_initializer.py tests/test_energy_constrained_initializer.py
          src/kron_reduce/workflows/energy_initializer_synthetic.py
          src/kron_reduce/data/energy_saved_inputs.py
          src/kron_reduce/evaluation/energy_initializer_audit.py
          tests/test_energy_initializer_workflow.py
          tests/test_energy_saved_inputs.py tests/test_energy_initializer_audit.py
          src/kron_reduce/data/energy_cap_saved_inputs.py
          src/kron_reduce/evaluation/encoder_energy_cap.py
          src/kron_reduce/evaluation/energy_cap_scores.py
          src/kron_reduce/evaluation/energy_cap_transfer.py
          src/kron_reduce/workflows/kiki_energy_cap_transfer.py
          tests/test_encoder_energy_cap.py tests/test_energy_cap_saved_inputs.py
          tests/test_energy_cap_scores.py tests/test_energy_cap_transfer.py
          tests/test_energy_cap_workflow.py
          src/kron_reduce/evaluation/energy_confirmation.py
          src/kron_reduce/workflows/energy_confirmation_synthetic.py
          tests/test_energy_confirmation.py tests/test_energy_confirmation_workflow.py
          tests/test_constant_c_synthetic_guard.py
          tests/test_harness.py tests/test_research_policy.py tests/test_runner_safety.py
          tests/test_development_file_bindings.py tests/test_kiki_task3_frozen_eval.py
          tests/test_audit_access_ledger.py tests/test_durable_audit_ledger.py
          tests/test_limited_hdf_audit.py tests/test_record20_input.py
          tests/test_record20_coordinates.py tests/test_record20_metadata.py
          tests/test_bounded_input_cli_guard.py tests/test_record20_workflow.py
          tests/test_audit_budget.py tests/test_train_mechanism_audit.py tests/test_train_mechanism_workflow.py
          tests/test_train_refinement_budget.py tests/test_train_refinement_audit.py tests/test_train_refinement_workflow.py
          tests/test_limited_npz_audit.py tests/test_integral_initializer.py
          tests/test_history_cache_preflight.py tests/test_history_metrics.py tests/test_history_mechanism.py
          tests/test_scoped_audit_journal.py tests/test_integral_history_workflow.py
          tests/test_integral_history_artifact_contract.py
          tests/test_pm_impulse_reader.py tests/test_pm_impulse_audit.py
          tests/test_pm_impulse_workflow.py tests/test_pm_impulse_durability.py
      - name: Test the harness, policy and synthetic workflows
        # Source-file checksum verification requires the private local dataset.
        run: >-
          python -m pytest -q -k "not test_data_checksums"
          tests/test_machine_local_equation.py
          tests/test_machine_local_memory_diagnosis.py tests/test_machine_local_memory_fit.py
          tests/test_machine_local_topology.py
          tests/test_machine_local_trainable_stiffness.py tests/test_kiki_machine_local_r20_r21.py
          tests/test_machine_local_forecast.py tests/test_machine_local_stiffness_calibration.py
          tests/test_machine_local_hidden_oracle_saved_audit.py
          tests/test_task3_full.py tests/test_kiki_machine_local_full.py tests/test_kiki_machine_local_full_saved.py
          tests/test_machine_local_hidden_oracle.py tests/test_policy_consumed_audit.py
          tests/test_conditional_encoder.py tests/test_initializer_diagnosis_workflow.py
          tests/test_machine_local.py tests/test_machine_local_workflow.py
          tests/test_discrete_history_initializer.py tests/test_observer_workflow.py
          tests/test_joint_history_initializer.py tests/test_joint_observer_workflow.py
          tests/test_gaussian_state_posterior.py tests/test_gaussian_oracle_risks.py
          tests/test_gaussian_oracle_workflow.py
