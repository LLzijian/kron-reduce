task_type = "conditional_closed_loop_rollout"
dataset = "ieee39_postclear_canonical_v1"
view = "combined_dynamics"
split_name = "combined_line_5fold_v1"
folds = ["F1", "F2", "F3", "F4", "F5"]
representation = "clustered_7"

# Round 3A deliberately evaluates the conditional upper bound: every RK4
# stage receives the measured Pm schedule by linear interpolation.  This is
# not a causal deployment claim and is never mixed with a ZOH table.
main_pm_mode = "observed"
primary_analysis = "conditional_observed_pm"
seeds = [324]
horizon_steps = [20, 40, 100]
epochs = 60
learning_rate = 0.0005
bootstrap_draws = 2000
methods = ["M0", "M2A"]
final_candidate_methods = ["M0", "M2A"]
target_omega_r2 = 0.9
validation_min_improvement = 0.02
evaluate_stability = false
require_validation_gate_before_test = true

# The round-2 M0 checkpoint is immutable and hash verified.  Its validation
# loss is recomputed under the round-3 observed-Pm policy before comparison.
frozen_m0_run = "results/paper_m2a_round2_single_seed-full_run-20260728T015611Z-72327e35"

minimum_fit_steps = 2
integral_windows = [1, 5, 20]
ridge_values = [1e-8, 1e-6, 1e-4, 1e-2]
sindy_thresholds = [0.0, 1e-6, 1e-4, 1e-3, 1e-2, 1e-1]
m2a_rollout_shortlist = 7
m2a_residual_scales = [0.05, 0.1, 0.2, 0.4, 0.7, 1.0]

# Label-free robustness constraints.  Linear residual terms may add damping
# but cannot add anti-damping, and the worst 10% validation loss may not exceed
# frozen M0.  The exact zero residual remains an eligible fallback.
m2a_enforce_dissipative_linear_terms = true
m2a_validation_cvar_fraction = 0.1
m2a_max_cvar_degradation = 0.0

rollout_refine = false
refinement_min_improvement = 0.02
max_internal_step = 0.01
old_m0_h100_mean_rmse = 9.695
