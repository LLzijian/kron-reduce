[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kron-reduce"
version = "0.1.0"
description = "Leakage-audited reduced post-clear dynamics for IEEE39"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.2",
]

[project.optional-dependencies]
paper = ["matplotlib>=3.8", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
kron-reduce = "project_harness.__main__:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["project_harness*", "kron_reduce*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
